name: foundation
on:
  push:
    branches: [DEV, "codex/**", "claude/**"]
  pull_request:
    branches: [DEV]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_repo.py
      - run: python -m backend.smoke
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --console=plain

name: foundation
on:
  push:
    branches: [DEV, "codex/**", "claude/**"]
  pull_request:
    branches: [DEV]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_repo.py
      - run: python -m backend.smoke
      - name: Benchmark harness unit tests
        run: python -m unittest discover -s research/models -p "test_*.py" -v
      - name: VoIP route harness unit tests
        run: python -m unittest discover -s research/audio_route -p "test_*.py" -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Install SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and lint
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --console=plain --no-daemon